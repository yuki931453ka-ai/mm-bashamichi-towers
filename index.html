body {

.mode-btn {

  background: transparent;
  color: var(--muted);

.mode-btn[aria-pressed="true"][data-mode="sale"] {

.mode-btn[aria-pressed="true"][data-mode="rent"] {

.theme-btn {

.tab-nav {

.tab-btn {

.table-wrap {

  padding: 16px;

}
.prop-table {
  width: 100%; border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;

.prop-table caption {

.prop-table thead { position: sticky; top: 0; z-index: 10; }
.prop-table th {

    note: '臨港パーク至近'
  },
  {
    name: 'ブランズタワーみなとみらい',
    area: 'みなとみらい',
    address: '横浜市西区みなとみらい3-7-2',
    lat: 35.45882, lng: 139.633804,
    floors: 29, units: 228, year: 2017,
    station: 'みなとみらい駅', walkMin: 2,
    sqm: [55, 130],
    sale: [8000, 34000], saleListings: 1,
    rent: [22, 55], rentListings: 1,
    amenities: ['免震構造', 'コンシェルジュ', '24時間有人管理', 'オートロック'],
    status: 'existing',
    note: 'クイーンズスクエア隣接'
  }
];

let currentMode = 'sale';
let currentSort = { key: null, asc: true };
let map = null;
const markers = [];

const SIZE_TIERS = [
  { min: 1000, radius: 20, label: '大規模 (1,000戸超)' },
  { min: 500, radius: 16, label: '中大規模 (500〜1,000戸)' },
  { min: 200, radius: 13, label: '中規模 (200〜500戸)' },
  { min: 0, radius: 10, label: '小規模 (200戸未満)' }
];

function markerSize(units) {
  return (SIZE_TIERS.find(t => units >= t.min) || SIZE_TIERS[SIZE_TIERS.length - 1]).radius;
}

function formatPrice(man) {
  if (man >= 10000) {
    const oku = man / 10000;
    return (oku % 1 === 0 ? oku.toFixed(0) : oku.toFixed(1)) + '億';
  }
  return man.toLocaleString() + '万';
}

function formatPriceRange(range, mode) {
  if (!range) return '賃貸募集なし';
  if (mode === 'rent') return range[0] + '万〜' + range[1] + '万/月';
  return formatPrice(range[0]) + '〜' + formatPrice(range[1]);
}

function markerColor() {
  return currentMode === 'sale' ? '#c0503a' : '#2a8a6f';
}

function listingsBadge(count, saleNote) {
  if (saleNote) return '<span class="popup-listings new-sale">' + escapeHtml(saleNote) + '</span>';
  if (count > 0) return '<span class="popup-listings has">' + count + '件募集中</span>';
  return '<span class="popup-listings none">現在募集なし</span>';
}

function popupHTML(p) {
  const priceRange = currentMode === 'sale' ? p.sale : p.rent;
  const mc = currentMode;
  const ml = currentMode === 'sale' ? '売買価格帯' : '賃貸価格帯';
  const listingsCount = currentMode === 'sale' ? (p.saleListings || 0) : (p.rentListings || 0);
  const saleNote = currentMode === 'sale' ? (p.saleNote || null) : null;
  const dn = escapeHtml(p.name);
  return '<div class="popup-card">' +
    '<div class="popup-name">' + dn + '</div>' +
    '<div class="popup-note">' + escapeHtml(p.note) + '</div>' +
    '<div class="popup-meta"><span>' + escapeHtml(p.address) + '</span></div>' +
    '<div class="popup-meta"><span>' + escapeHtml(p.station) + ' 徒歩' + p.walkMin + '分</span></div>' +
    '<div class="popup-stats">' +
      '<div class="popup-stat"><div class="popup-stat-label">階数</div><div class="popup-stat-value">' + p.floors + 'F</div></div>' +
      '<div class="popup-stat"><div class="popup-stat-label">総戸数</div><div class="popup-stat-value">' + p.units + '</div></div>' +
      '<div class="popup-stat"><div class="popup-stat-label">竣工' + (p.status === 'planned' ? '予定' : '年') + '</div><div class="popup-stat-value">' + p.year + '</div></div>' +
    '</div>' +
    '<div class="popup-price-section">' +
      '<div class="popup-price-label ' + mc + '">' + ml + '</div>' +
      '<div class="popup-price ' + mc + '">' + escapeHtml(formatPriceRange(priceRange, currentMode)) + '</div>' +
      '<div class="popup-price-sub">' + (p.sqm ? p.sqm[0] + '〜' + p.sqm[1] + '㎡' : '') + '</div>' +
      '<div style="margin-top:6px">' + listingsBadge(listingsCount, saleNote) + '</div>' +
    '</div>' +
    '<div class="popup-tags">' + p.amenities.map(a => '<span class="popup-tag">' + escapeHtml(a) + '</span>').join('') + '</div>' +
  '</div>';
}

function createMarkerIcon(p, color) {
  const size = markerSize(p.units);
  return L.divIcon({
    className: '',
    html: '<div class="custom-marker" style="width:' + (size * 2) + 'px;height:' + (size * 2) + 'px;background:' + color + ';font-size:' + (size > 13 ? 11 : 10) + 'px">' + p.floors + '</div>',
    iconSize: [size * 2, size * 2],
    iconAnchor: [size, size],
    popupAnchor: [0, -size]
  });
}

function initMap() {
  map = L.map('map', {
    center: [35.4566, 139.6340],
    zoom: 16,
    zoomControl: false
  });
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);
  createMarkers();
}

function createMarkers() {
  const color = markerColor();
  PROPERTIES.forEach(p => {
    const size = markerSize(p.units);
    const dn = p.name;
    const marker = L.marker([p.lat, p.lng], {
      icon: createMarkerIcon(p, color),
      title: dn,
      alt: dn
    }).addTo(map);
    marker.bindPopup(popupHTML(p), { maxWidth: 320, minWidth: 220, autoPanPaddingTopLeft: [10, 100] });
    marker.bindTooltip(dn, { direction: 'top', offset: [0, -size - 4] });
    marker.on('mouseover', function() { this.setZIndexOffset(1000); });
    marker.on('mouseout', function() { this.setZIndexOffset(0); });
    marker._prop = p;
    markers.push(marker);
  });
}

function updateMarkers() {
  const color = markerColor();
  markers.forEach(m => {
    const p = m._prop;
    m.setIcon(createMarkerIcon(p, color));
    m.setPopupContent(popupHTML(p));
  });
}

function updateLegend() {
  const color = markerColor();
  const modeText = currentMode === 'sale' ? '売買モード' : '賃貸モード';
  const el = document.getElementById('legend');
  el.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'legend-title';
  title.textContent = modeText;
  el.appendChild(title);
  SIZE_TIERS.forEach(t => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    const dot = document.createElement('span');
    dot.className = 'legend-dot';
    dot.style.cssText = 'background:' + color + ';width:' + t.radius + 'px;height:' + t.radius + 'px';
    item.appendChild(dot);
    item.appendChild(document.createTextNode(' ' + t.label));
    el.appendChild(item);
  });
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-sale').setAttribute('aria-pressed', mode === 'sale');
  document.getElementById('btn-rent').setAttribute('aria-pressed', mode === 'rent');
  updateMarkers();
  updateLegend();
  renderTable();
  document.getElementById('table-caption').textContent =
    'みなとみらい・馬車道エリア タワーマンション比較（' +
    (mode === 'sale' ? '売買' : '賃貸') + '価格帯 下限値でソート）';
}

function setTab(tab) {
  document.getElementById('tab-map').setAttribute('aria-selected', tab === 'map');
  document.getElementById('tab-table').setAttribute('aria-selected', tab === 'table');
  document.getElementById('map-view').hidden = tab !== 'map';
  document.getElementById('table-view').hidden = tab !== 'table';
  if (tab === 'map' && map) map.invalidateSize();
}

// Theme
function getStoredTheme() {
  try { return localStorage.getItem('theme'); } catch { return null; }
}

function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.getElementById('theme-icon').textContent = '🌙';
  } else if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('theme-icon').textContent = '☀️';
  } else {
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('theme-icon').textContent = window.matchMedia('(prefers-color-scheme: dark)').matches ? '🌙' : '☀️';
  }
}

function cycleTheme() {
  const current = getStoredTheme();
  let next;
  if (current === null) next = 'dark';
  else if (current === 'dark') next = 'light';
  else next = null;
  if (next) {
    try { localStorage.setItem('theme', next); } catch {}
  } else {
    try { localStorage.removeItem('theme'); } catch {}
  }
  applyTheme(next);
}

// Table
const TABLE_COLS = [
  { key: 'name', label: '物件名', sortable: true },
  { key: 'area', label: 'エリア', sortable: true },
  { key: 'price', label: '価格帯', sortable: true },
  { key: 'listings', label: '募集数', sortable: true },
  { key: 'year', label: '竣工年', sortable: true },
  { key: 'floors', label: '階数', sortable: true },
  { key: 'units', label: '総戸数', sortable: true },
  { key: 'station', label: '最寄駅', sortable: false },
  { key: 'walkMin', label: '徒歩', sortable: true },
  { key: 'sqm', label: '面積', sortable: false },
  { key: 'amenities', label: '主な設備', sortable: false }
];

function sortValue(p, key) {
  if (key === 'price') {
    const range = currentMode === 'sale' ? p.sale : p.rent;
    return range ? range[0] : null;
  }
  if (key === 'listings') {
    return currentMode === 'sale' ? (p.saleListings || 0) : (p.rentListings || 0);
  }
  if (key === 'name') return p.name;
  if (key === 'area') return p.area;
  return p[key] != null ? p[key] : 0;
}

function renderTableHead() {
  const priceLabel = currentMode === 'sale' ? '売買価格帯' : '賃貸価格帯';
  const listingsLabel = currentMode === 'sale' ? '売買募集' : '賃貸募集';
  const thead = document.getElementById('table-head');
  thead.innerHTML = '';
  const tr = document.createElement('tr');
  TABLE_COLS.forEach(c => {
    const th = document.createElement('th');
    const label = c.key === 'price' ? priceLabel : c.key === 'listings' ? listingsLabel : c.label;
    if (c.sortable) {
      const arrow = currentSort.key === c.key ? (currentSort.asc ? ' ↑' : ' ↓') : '';
      const sortDir = currentSort.key === c.key ? (currentSort.asc ? 'ascending' : 'descending') : 'none';
      th.setAttribute('aria-sort', sortDir);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = label;
      const span = document.createElement('span');
      span.className = 'sort-arrow';
      span.textContent = arrow;
      btn.appendChild(span);
      btn.addEventListener('click', () => sortBy(c.key));
      th.appendChild(btn);
    } else {
      th.className = 'no-sort';
      th.textContent = label;
    }
    tr.appendChild(th);
  });
  thead.appendChild(tr);
}

function renderTableBody() {
  const sorted = [...PROPERTIES];
  if (currentSort.key) {
    sorted.sort((a, b) => {
      const va = sortValue(a, currentSort.key);
      const vb = sortValue(b, currentSort.key);
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      if (typeof va === 'string') return currentSort.asc ? va.localeCompare(vb) : vb.localeCompare(va);
      return currentSort.asc ? va - vb : vb - va;
    });
  }
  const mc = currentMode;
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  sorted.forEach(p => {
    const priceRange = currentMode === 'sale' ? p.sale : p.rent;
    const tr = document.createElement('tr');
    const listingsCount = currentMode === 'sale' ? (p.saleListings || 0) : (p.rentListings || 0);
    const saleNote = currentMode === 'sale' ? (p.saleNote || null) : null;
    const badgeCls = saleNote ? 'new-sale' : (listingsCount > 0 ? 'has' : 'none');
    const badgeText = saleNote ? escapeHtml(saleNote) : (listingsCount > 0 ? listingsCount + '件' : '0件');
    const cells = [
      { html: '<span class="td-name">' + escapeHtml(p.name) + '</span>' },
      { html: '<span class="td-area">' + escapeHtml(p.area) + '</span>' },
      { html: '<span class="td-price ' + mc + '">' + escapeHtml(formatPriceRange(priceRange, currentMode)) + '</span>' },
      { html: '<span class="td-listings"><span class="badge ' + badgeCls + '">' + badgeText + '</span></span>' },
      { html: p.year + '年' + (p.status === 'planned' ? '<br><span style="font-size:10px;color:var(--rent)">竣工予定</span>' : ''), cls: 'td-num' },
      { html: p.floors + 'F', cls: 'td-num' },
      { html: p.units.toLocaleString() + '戸', cls: 'td-num' },
      { text: p.station },
      { html: p.walkMin + '分', cls: 'td-num' },
      { text: p.sqm ? p.sqm[0] + '〜' + p.sqm[1] + '㎡' : '—' },
      { html: '<div class="td-tags">' + p.amenities.slice(0, 4).map(a => '<span class="td-tag">' + escapeHtml(a) + '</span>').join('') + '</div>' }
    ];
    cells.forEach(c => {
      const td = document.createElement('td');
      if (c.cls) td.className = c.cls;
      if (c.text) td.textContent = c.text;
      else td.innerHTML = c.html;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function renderTable() {
  renderTableHead();
  renderTableBody();
}

function sortBy(key) {
  if (currentSort.key === key) {
    currentSort.asc = !currentSort.asc;
  } else {
    currentSort = { key, asc: true };
  }
  renderTable();
}

// Event binding
document.addEventListener('DOMContentLoaded', () => {
  applyTheme(getStoredTheme());

  document.getElementById('btn-sale').addEventListener('click', () => setMode('sale'));
  document.getElementById('btn-rent').addEventListener('click', () => setMode('rent'));
  document.getElementById('tab-map').addEventListener('click', () => setTab('map'));
  document.getElementById('tab-table').addEventListener('click', () => setTab('table'));
  document.getElementById('theme-toggle').addEventListener('click', cycleTheme);

  initMap();
  updateLegend();
  renderTable();
});
</script>
