    '<div class="popup-price-section">' +
      '<div class="popup-price-label ' + modeClass + '">' + modeLabel + '</div>' +
      '<div class="popup-price ' + modeClass + '">' + formatPriceRange(priceRange, currentMode) + '</div>' +
      '<div class="popup-price-sub">' + (p.sqm ? p.sqm[0] + '〜' + p.sqm[1] + '㎡' : '') + '</div>' +
    '</div>' +
    '<div class="popup-tags">' + p.amenities.map(function(a) { return '<span class="popup-tag">' + a + '</span>'; }).join('') + '</div>' +
  '</div>';
}

function initMap() {
  map = L.map('map', {
    center: [35.4540, 139.6325],
    zoom: 15,
    zoomControl: false
  });
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);
  renderMarkers();
}

function renderMarkers() {
  markers.forEach(function(m) { map.removeLayer(m); });
  markers = [];
  var color = currentMode === 'sale' ? '#c0503a' : '#2a8a6f';
  PROPERTIES.forEach(function(p) {
    var size = markerSize(p.units);
    var icon = L.divIcon({
      className: '',
      html: '<div class="custom-marker" style="width:' + (size*2) + 'px;height:' + (size*2) + 'px;background:' + color + ';font-size:' + (size > 15 ? 11 : 10) + 'px">' + p.floors + '</div>',
      iconSize: [size*2, size*2],
      iconAnchor: [size, size],
      popupAnchor: [0, -size]
    });
    var marker = L.marker([p.lat, p.lng], { icon: icon }).addTo(map);
    marker.bindPopup(popupHTML(p), { maxWidth: 320, minWidth: 220, autoPanPaddingTopLeft: [10, 100] });
    var displayName = p.name.replace(/\n/g, ' ');
    marker.bindTooltip(displayName, { direction: 'top', offset: [0, -size-4] });
    marker._propData = p;
    markers.push(marker);
  });
}

function updateLegend() {
  var color = currentMode === 'sale' ? '#c0503a' : '#2a8a6f';
  var modeText = currentMode === 'sale' ? '売買モード' : '賃貸モード';
  var items = SIZE_TIERS.map(function(t) {
    return '<div class="legend-item"><span class="legend-dot" style="background:' + color + ';width:' + t.radius + 'px;height:' + t.radius + 'px"></span> ' + t.label + '</div>';
  }).join('');
  document.getElementById('legend').innerHTML = '<div class="legend-title">' + modeText + '</div>' + items;
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  renderMarkers();
  updateLegend();
  renderTable();
}

function setTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  document.getElementById('map-view').hidden = tab !== 'map';
  document.getElementById('table-view').hidden = tab !== 'table';
  if (tab === 'map') map.invalidateSize();
}

var TABLE_COLS = [
  { key: 'name', label: '物件名', sortable: true },
  { key: 'area', label: 'エリア', sortable: true },
  { key: 'price', label: '価格帯', sortable: true },
  { key: 'year', label: '竣工年', sortable: true },
  { key: 'floors', label: '階数', sortable: true },
  { key: 'units', label: '総戸数', sortable: true },
  { key: 'station', label: '最寄駅', sortable: false },
  { key: 'walkMin', label: '徒歩', sortable: true },
  { key: 'sqm', label: '面積', sortable: false },
  { key: 'amenities', label: '主な設備', sortable: false }
];

function sortValue(p, key) {
  if (key === 'price') {
    var range = currentMode === 'sale' ? p.sale : p.rent;
    return range ? range[0] : null;
  }
  if (key === 'name') return p.name;
  if (key === 'area') return p.area;
  return p[key] != null ? p[key] : 0;
}

function renderTableHead() {
  var priceLabel = currentMode === 'sale' ? '売買価格帯' : '賃貸価格帯';
  var cols = TABLE_COLS.map(function(c) {
    var label = c.key === 'price' ? priceLabel : c.label;
    var arrow = currentSort.key === c.key ? (currentSort.asc ? ' ↑' : ' ↓') : '';
    var click = c.sortable ? ' onclick="sortBy(\'' + c.key + '\')"' : '';
    return '<th' + click + '>' + label + '<span class="sort-arrow">' + arrow + '</span></th>';
  }).join('');
  document.getElementById('table-head').innerHTML = '<tr>' + cols + '</tr>';
}

function renderTableBody() {
  var sorted = PROPERTIES.slice();
  if (currentSort.key) {
    sorted.sort(function(a, b) {
      var va = sortValue(a, currentSort.key);
      var vb = sortValue(b, currentSort.key);
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      if (typeof va === 'string') return currentSort.asc ? va.localeCompare(vb) : vb.localeCompare(va);
      return currentSort.asc ? va - vb : vb - va;
    });
  }
  var modeClass = currentMode;
  var rows = sorted.map(function(p) {
    var priceRange = currentMode === 'sale' ? p.sale : p.rent;
    var displayName = p.name.replace(/\n/g, '<br>');
    return '<tr>' +
      '<td><span class="td-name">' + displayName + '</span></td>' +
      '<td><span class="td-area">' + p.area + '</span></td>' +
      '<td><span class="td-price ' + modeClass + '">' + formatPriceRange(priceRange, currentMode) + '</span></td>' +
      '<td class="td-num">' + p.year + '年' + (p.status === 'planned' ? '<br><span style="font-size:10px;color:var(--rent)">竣工予定</span>' : '') + '</td>' +
      '<td class="td-num">' + p.floors + 'F</td>' +
      '<td class="td-num">' + p.units.toLocaleString() + '戸</td>' +
      '<td>' + p.station + '</td>' +
      '<td class="td-num">' + p.walkMin + '分</td>' +
      '<td>' + (p.sqm ? p.sqm[0] + '〜' + p.sqm[1] + '㎡' : '—') + '</td>' +
      '<td><div class="td-tags">' + p.amenities.slice(0, 4).map(function(a) { return '<span class="td-tag">' + a + '</span>'; }).join('') + '</div></td>' +
    '</tr>';
  }).join('');
  document.getElementById('table-body').innerHTML = rows;
}

function renderTable() {
  renderTableHead();
  renderTableBody();
}

function sortBy(key) {
  if (currentSort.key === key) {
    currentSort.asc = !currentSort.asc;
  } else {
    currentSort = { key: key, asc: true };
  }
  renderTable();
}

document.addEventListener('DOMContentLoaded', function() {
  initMap();
  updateLegend();
  renderTable();
});
</script>

</body>
</html>
